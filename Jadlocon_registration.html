<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
 
        .container {
            width: 300px;
            border: 1px solid #000000;
            padding: 20px;
        }
 
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 1px solid #000000;
            padding-bottom: 10px;
        }
 
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
        }
 
        .step {
            text-align: center;
        }
 
        .step-number {
            border: 1px solid #000000;
            width: 20px;
            height: 20px;
            line-height: 20px;
            border-radius: 50%;
            margin: 0 auto 4px auto;
        }
 
        .form-group {
            margin-bottom: 15px;
        }
 
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }
 
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            box-sizing: border-box;
        }
 
        .progress-bar {
            width: 100%;
            height: 8px;
            border: 1px solid #000000;
            margin-top: 20px;
            margin-bottom: 20px;
        }
 
        .progress-fill {
            width: 50%;
            height: 100%;
            background-color: #000000;
        }
 
        .nav {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #000000;
            padding-top: 10px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
 
    <div class="container">
        <div class="header">&lt; Registration</div>
 
        <div class="steps">
            <div class="step">
                <div class="step-number">1</div>
                <div>Account</div>
            </div>
            <div class="step">
                <div class="step-number">2</div>
                <div>Contact</div>
            </div>
            <div class="step">
                <div class="step-number">3</div>
                <div>Details</div>
            </div>
        </div>
 
        <form>
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Text">
            </div>
 
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Email">
            </div>
 
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Password">
            </div>
 
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </form>
 
        <div class="nav">
            <div>Home</div>
            <div>Book</div>
            <div><b>Menu</b></div>
            <div>Saved</div>
            <div>Profile</div>
        </div>
    </div>
 
</body>
</html>
